name: Daily Auto Commit

on:
  schedule:
    - cron: '5 2-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update streak file
        run: |
          echo "Last active: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > streak.txt

      - name: Commit and Push
        run: |
          git config user.name "Zedxv55"
          git config user.email "zeetosit@gmail.com"
          git pull --rebase || true
          git add streak.txt
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "chore: auto streak update" && git push)
